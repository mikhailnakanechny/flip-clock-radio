name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check the committed build is up to date
        run: |
          git diff --exit-code -- public
          test -z "$(git status --porcelain -- public)"

      - name: Smoke test
        run: node .opencode/skills/webapp-verify/scripts/verify.mjs
