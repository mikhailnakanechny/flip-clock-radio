om:1px solid #1c1c20;justify-content:space-between;align-items:center;margin-bottom:1vh;padding-bottom:1.2vh;display:flex;position:sticky;top:0}.picker-head span{font-size:calc(var(--fs) * 1.12);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.row{background:#141417;border:1px solid #0000;border-radius:1.1vh;justify-content:space-between;align-items:center;gap:2vw;padding:1.5vh 2.2vw;display:flex}.row.on{border-color:var(--accent);background:#10201e}.row .txt{flex-direction:column;gap:.2vh;min-width:0;display:flex}.row .n{font-size:calc(var(--fs) * 1.25);color:#f0f0f2;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.row .s{font-size:var(--fs);color:var(--dim)}.row .now{font-size:var(--fs);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);flex:none}.sec-label{font-size:var(--fs);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:1vh 0 .2vh}.sel{color:var(--ink);font-family:inherit;font-size:calc(var(--fs) * 1.05);cursor:pointer;background:#1c1c20;border:1px solid #35353c;border-radius:1.2vh;outline:none;flex:none;padding:.8vh 1.4vw}.sel option{color:#f0f0f2;background:#1c1c20}.inp{width:100%;color:var(--ink);font-family:inherit;font-size:calc(var(--fs) * 1.05);background:#1c1c20;border:1px solid #35353c;border-radius:1.2vh;outline:none;padding:1.1vh 1.6vw}.inp::placeholder{color:#6d6d73}.form{flex-direction:column;gap:1vh;display:flex}.btns{gap:2vw;margin-top:.4vh;display:flex}.ghost{color:var(--ink);cursor:pointer;font-family:inherit;font-size:calc(var(--fs) * 1.05);background:#17171a;border:1px solid #35353c;border-radius:1.2vh;flex:auto;padding:1.1vh 2vw}.del{color:#ff8a80;cursor:pointer;width:8vh;min-width:36px;height:8vh;min-height:36px;line-height:1;font-size:calc(var(--fs) * 1.12);background:#241314;border:1px solid #4a2426;border-radius:50%;flex:none;justify-content:center;align-items:center;display:flex}.swatch{flex:none;gap:.7vw;display:flex}.swatch i{border:1px solid #ffffff38;border-radius:50%;width:2.8vh;min-width:13px;height:2.8vh;min-height:13px;display:block}.meta{cursor:pointer}.chev{color:var(--dim);margin-left:.6vw;font-size:2vh}.hint{text-align:center;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;opacity:0;pointer-events:none;font-size:2.6vh;transition:opacity .4s;position:fixed;bottom:13vh;left:0;right:0}.hint.show{opacity:.9}@media (max-aspect-ratio:1){.card{width:36vw;height:26vh}.digit{font-size:20vh}.colon{gap:3vh;width:7vw}.colon i{width:2.4vw;height:2.4vw}.clock{gap:2.5vw}.group{gap:2vw}}

</head>
<body>
  <div class="stage" id="stage">
    <div class="clock">
      <div class="group" id="h1"></div>
      <div class="group" id="h2"></div>
      <div class="colon" id="colon"><i></i><i></i></div>
      <div class="group" id="m1"></div>
      <div class="group" id="m2"></div>
    </div>
    <div class="date" id="date"></div>
    <div class="secs" id="secs"></div>
  </div>

  <div class="player" id="player">
    <button class="btn" id="prev" aria-label="previous station">&#9664;&#9664;</button>
    <button class="btn primary" id="play" aria-label="play">&#9654;</button>
    <button class="btn" id="next" aria-label="next station">&#9654;&#9654;</button>
    <div class="meta" id="meta" title="choose station">
      <div class="station"><span class="dot" id="dot"></span><span id="stationName">—</span><span class="chev">&#9662;</span></div>
      <div class="sub" id="stationSub">tap play to start</div>
    </div>
    <input type="range" id="vol" min="0" max="100" value="70" aria-label="volume">
    <button class="btn" id="cfg" aria-label="settings" title="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="btn" id="fs" aria-label="fullscreen" title="fullscreen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5"/><path d="M20 15v5h-5"/>
        <path d="M15 4h5v5"/><path d="M9 20H4v-5"/>
      </svg>
    </button>
  </div>

  <div class="picker" id="picker">
    <div class="picker-head">
      <span>Stations</span>
      <button class="btn" id="closePicker" aria-label="close">&#10005;</button>
    </div>
    <div id="stationList"></div>
  </div>

  <div class="picker" id="settings">
    <div class="picker-head">
      <span>Settings</span>
      <button class="btn" id="closeSettings" aria-label="close">&#10005;</button>
    </div>
    <div class="sec-label">Clock</div>
    <div id="clockList"></div>
    <div class="sec-label">Appearance</div>
    <div class="row">
      <div class="txt"><div class="n">Theme</div></div>
      <select class="sel" id="themeSel" aria-label="theme"></select>
    </div>
    <div class="row">
      <div class="txt"><div class="n">Font size</div></div>
      <select class="sel" id="fontSel" aria-label="font size"></select>
    </div>
    <div class="row" id="openStations">
      <div class="txt">
        <div class="n">Stations</div>
        <div class="s" id="stationCount">manage list</div>
      </div>
      <div class="now">&#8250;</div>
    </div>
  </div>

  <div class="picker" id="stationsPanel">
    <div class="picker-head">
      <span>Stations</span>
      <button class="btn" id="closeStations" aria-label="close">&#10005;</button>
    </div>
    <div id="manageList"></div>
    <div class="sec-label">Add station</div>
    <div class="form">
      <input class="inp" id="newName" type="text" placeholder="Name, e.g. NTS Radio" />
      <input class="inp" id="newUrl" type="url" inputmode="url" placeholder="https://stream.example.com/live.mp3" />
      <div class="btns">
        <button class="ghost" id="addStation">Add</button>
        <button class="ghost" id="restoreStations">Restore defaults</button>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">tap &#9654; to start the radio</div>


</body>
</html>
