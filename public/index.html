  <body>
    <div class="stage" id="stage">
      <div class="clock">
        <div class="group" id="h1"></div>
        <div class="group" id="h2"></div>
        <div class="colon" id="colon"><i></i><i></i></div>
        <div class="group" id="m1"></div>
        <div class="group" id="m2"></div>
      </div>
      <div class="date" id="date"></div>
      <div class="secs" id="secs"></div>
    </div>

    <div class="player" id="player">
      <button class="btn" id="prev" aria-label="previous station">&#9664;&#9664;</button>
      <button class="btn primary" id="play" aria-label="play">&#9654;</button>
      <button class="btn" id="next" aria-label="next station">&#9654;&#9654;</button>
      <div
        class="meta"
        id="meta"
        title="choose station"
        role="button"
        tabindex="0"
        aria-label="choose station"
        aria-expanded="false"
      >
        <div class="station">
          <span class="dot" id="dot"></span><span id="stationName">—</span
          ><span class="chev">&#9662;</span>
        </div>
        <div class="sub" id="stationSub">tap play to start</div>
      </div>
      <input type="range" id="vol" min="0" max="100" value="70" aria-label="volume" />
    </div>

    <div class="corner-actions" id="cornerActions">
      <button class="btn" id="cfg" aria-label="settings" title="settings">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
      <button class="btn" id="fs" aria-label="fullscreen" title="fullscreen">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 9V4h5" />
          <path d="M20 15v5h-5" />
          <path d="M15 4h5v5" />
          <path d="M9 20H4v-5" />
        </svg>
      </button>
    </div>

    <div class="picker" id="picker">
      <div class="picker-head">
        <span>Stations</span>
        <button class="btn" id="closePicker" aria-label="close">&#10005;</button>
      </div>
      <div id="stationList"></div>
    </div>

    <div class="picker" id="settings">
      <div class="picker-head">
        <span>Settings</span>
        <button class="btn" id="closeSettings" aria-label="close">&#10005;</button>
      </div>
      <div class="sec-label">Clock</div>
      <div id="clockList"></div>
      <div class="sec-label">Appearance</div>
      <div class="row">
        <div class="txt"><div class="n">Theme</div></div>
        <select class="sel" id="themeSel" aria-label="theme"></select>
      </div>
      <div class="row">
        <div class="txt"><div class="n">Font size</div></div>
        <select class="sel" id="fontSel" aria-label="font size"></select>
      </div>
      <div class="row">
        <div class="txt"><div class="n">Volume</div></div>
        <input
          class="sel"
          id="volumeSetting"
          type="range"
          min="0"
          max="100"
          value="70"
          aria-label="volume"
        />
      </div>
      <div class="row" id="openStations" role="button" tabindex="0">
        <div class="txt">
          <div class="n">Stations</div>
          <div class="s" id="stationCount">manage list</div>
        </div>
        <div class="now">&#8250;</div>
      </div>
    </div>

    <div class="picker" id="stationsPanel">
      <div class="picker-head">
        <span>Stations</span>
        <button class="btn" id="closeStations" aria-label="close">&#10005;</button>
      </div>
      <div id="manageList"></div>
      <div class="sec-label">Add station</div>
      <div class="form">
        <input class="inp" id="newName" type="text" placeholder="Name, e.g. NTS Radio" />
        <input
          class="inp"
          id="newUrl"
          type="url"
          inputmode="url"
          placeholder="https://stream.example.com/live.mp3"
        />
        <div class="btns">
          <button class="ghost" id="addStation">Add</button>
          <button class="ghost" id="restoreStations">Restore defaults</button>
        </div>
      </div>
    </div>

    <div class="hint" id="hint">tap &#9654; to start the radio</div>

  </body>
</html>
